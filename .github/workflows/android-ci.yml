name: Android CI

on:
  push:
    branches: [main, "feat/**"]
    paths-ignore: ["docs/**", "**/*.md", "iosApp/**", "firebase/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "iosApp/**", "firebase/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests y APK debug
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --console=plain

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: shared/build/reports/tests/
          retention-days: 7

      - name: APK debug
        uses: actions/upload-artifact@v7
        with:
          name: gowayki-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
